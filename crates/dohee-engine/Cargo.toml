[package]
name = "dohee-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
vulkan = ["dohee-infer/vulkan"]
cuda = ["dohee-infer/cuda"]

[dependencies]
dohee-core = { path = "../dohee-core" }
dohee-infer = { path = "../dohee-infer" }
dohee-tools = { path = "../dohee-tools" }
dohee-sandbox = { path = "../dohee-sandbox" }
dohee-context = { path = "../dohee-context" }
dohee-store = { path = "../dohee-store" }
dohee-config = { path = "../dohee-config" }

tokio = { version = "1.38", features = ["rt", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
