[workspace]
resolver = "2"
members = [
    "crates/dohee-core",
    "crates/dohee-infer",
    "crates/dohee-tools",
    "crates/dohee-sandbox",
    "crates/dohee-context",
    "crates/dohee-store",
    "crates/dohee-mcp",
    "crates/dohee-config",
    "crates/dohee-tui",
    "crates/dohee-cli",
    "crates/dohee-engine",
    "crates/dohee-prompt",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Scott"]

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
dialoguer = "0.11"
futures-util = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec", "io"] }
toml = "0.8"

# Subcrate specific dependencies
llama-cpp-2 = { version = "0.1.150", default-features = false }
minijinja = "2.12"
landlock = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
ratatui = "0.26"
encoding_rs = "0.8"
tempfile = "3.10"
async-trait = "0.1"
crossterm = "0.27"
arboard = "3.4"
tree-sitter = "0.22"
tree-sitter-rust = "0.20"
ignore = "0.4"
globset = "0.4"
html2md = "0.2"
urlencoding = "2.1"
reqwest = { version = "0.13", features = ["json", "stream"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
